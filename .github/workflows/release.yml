# Push a tag like v0.1.0 to build the .deb and .rpm and publish them as a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config libpipewire-0.3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb
      - run: cargo deb --locked
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: dnf install -y rpm-build cargo rust clang-devel pkgconf pipewire-devel alsa-lib-devel systemd-rpm-macros
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/SOURCES
          tar --exclude=./.git --transform "s,^\.,mixrail-$version," -czf ~/rpmbuild/SOURCES/mixrail-$version.tar.gz .
          rpmbuild -ba packaging/rpm/mixrail.spec
          mkdir out && cp ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm out/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: out/*.rpm

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cargo clang pipewire pipewire-audio alsa-lib wireplumber
          useradd -m builder
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/pkg && cp packaging/aur/PKGBUILD /tmp/pkg/
          tar --exclude=./.git --transform "s,^\.,mixrail-$version," -czf /tmp/pkg/mixrail-$version.tar.gz .
          cd /tmp/pkg
          # Build from this checkout (the release download's checksum isn't known yet).
          sed -i "s|^source=.*|source=(\"mixrail-$version.tar.gz\")|; s|^sha256sums=.*|sha256sums=('SKIP')|" PKGBUILD
          chown -R builder /tmp/pkg
          su builder -c "makepkg -f --noconfirm"
          mkdir -p "$GITHUB_WORKSPACE/out" && cp /tmp/pkg/mixrail-$version-*.pkg.tar.zst "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/*.pkg.tar.zst

  release:
    needs: [deb, rpm, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
